# Tells the GKE Secrets Store CSI driver which Secret Manager secrets to expose
# to the pod, and to mirror them into a Kubernetes Secret (app-secrets) so they
# can be consumed as environment variables. The pod authenticates to Secret
# Manager via Workload Identity — no keys are stored anywhere.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-db
  namespace: app
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/cotter-cloud-dev/secrets/dev-db-password/versions/latest"
        path: "db-password"
  # Sync the mounted secret into a K8s Secret for env-var consumption.
  secretObjects:
    - secretName: app-secrets
      type: Opaque
      data:
        - objectName: db-password
          key: db-password
