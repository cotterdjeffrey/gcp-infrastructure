# Kubernetes service account for the FastAPI workload.
# Workload Identity maps this KSA to the GCP service account created in
# modules/iam (dev-app-workload), which holds roles/cloudsql.client and
# roles/secretmanager.secretAccessor. The pod authenticates to Cloud SQL and
# Secret Manager as that GCP SA with no exported keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-workload
  namespace: app
  annotations:
    iam.gke.io/gcp-service-account: dev-app-workload@cotter-cloud-dev.iam.gserviceaccount.com
