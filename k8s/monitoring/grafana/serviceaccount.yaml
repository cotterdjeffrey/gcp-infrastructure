# Kubernetes service account for Grafana.
# Workload Identity maps this KSA to the GCP service account created in
# modules/iam (dev-grafana), which holds roles/secretmanager.secretAccessor on
# the Grafana admin password. Grafana reads that secret with no exported keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    iam.gke.io/gcp-service-account: dev-grafana@cotter-cloud-dev.iam.gserviceaccount.com
