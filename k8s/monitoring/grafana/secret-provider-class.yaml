# Exposes the Grafana admin password from Secret Manager to the Grafana pod via
# the GKE Secrets Store CSI driver, and mirrors it into a Kubernetes Secret
# (grafana-admin) for env-var consumption. Authenticated via Workload Identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/cotter-cloud-dev/secrets/dev-grafana-admin-password/versions/latest"
        path: "password"
  secretObjects:
    - secretName: grafana-admin
      type: Opaque
      data:
        - objectName: password
          key: password
